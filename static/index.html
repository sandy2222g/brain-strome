<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry Saver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..600&display=swap" rel="stylesheet">
<style>
  /* Tokens dealt by taste-skill: palette white-link-blue, type figtree (light); the inverse set is the dark theme. */
  :root {
    --p-bg: #ffffff; --p-surface: #f4f4f4; --p-ink: #111111; --p-muted: #6b6b6b;
    --p-accent: #1a4be0; --p-accent-ink: #ffffff; --p-rule: #dcdcdc;
    --font-display: "Figtree", system-ui, sans-serif;
    --font-text: "Figtree", system-ui, sans-serif;
    --r-ctl: 8px; --r-card: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --p-bg: #111111; --p-surface: #1e1e1e; --p-ink: #ffffff; --p-muted: #9a9a9a;
      --p-accent: #7f9bff; --p-accent-ink: #111111; --p-rule: #333333;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--p-bg); color: var(--p-ink); font: 400 16px/1.5 var(--font-text); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--p-accent); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  header { padding: 28px 0 20px; animation: enter 900ms ease-out both; }
  h1 { font: 400 clamp(32px, 6vw, 48px)/1.05 var(--font-display); letter-spacing: -0.025em; margin: 0 0 8px; }
  header p { margin: 0; color: var(--p-muted); max-width: 52ch; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; padding-bottom: 48px; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
  section { min-width: 0; }
  h2 { font: 400 24px/1.2 var(--font-display); letter-spacing: -0.02em; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h2 small { font: 400 14px var(--font-text); color: var(--p-muted); letter-spacing: 0; }

  form { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem 5rem 8rem; gap: 8px 8px; margin-bottom: 12px; align-items: end; }
  form .name { grid-column: 1 / -1; }
  form button { grid-column: 1 / -1; }
  @media (max-width: 560px) { form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  label { display: block; font: 500 13px var(--font-text); color: var(--p-muted); }
  input, select { width: 100%; min-height: 44px; font: 400 16px var(--font-text); color: var(--p-ink); background: var(--p-bg); border: 1px solid var(--p-rule); border-radius: var(--r-ctl); padding: 8px 10px; margin-top: 4px; }
  button { min-height: 44px; font: 500 16px var(--font-text); color: var(--p-accent-ink); background: var(--p-accent); border: 1px solid var(--p-accent); border-radius: var(--r-ctl); padding: 8px 16px; cursor: pointer;
    transition: filter 130ms ease-out, transform 130ms ease-out; }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); filter: brightness(.92); }
  button.ghost { background: transparent; color: var(--p-ink); border-color: var(--p-rule); }
  button.ghost:hover { background: var(--p-surface); filter: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-bottom: 16px; }
  .tools label { width: 7rem; }

  /* Shelf-life runway: bar length = days left (0 to 14), anchored at today. */
  .runway { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: minmax(6rem, 11rem) minmax(0, 1fr) 3rem 44px; gap: 8px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--p-rule); }
  .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm i { display: block; font-style: normal; font-size: 13px; font-weight: 400; color: var(--p-muted); }
  .track { position: relative; height: 12px; border-radius: 6px; background: var(--p-surface); overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--p-muted); border-radius: 6px; }
  .soon .bar { background: var(--p-accent); }
  .expired .bar { width: 100% !important; background: repeating-linear-gradient(135deg, var(--p-muted) 0 2px, transparent 2px 6px); opacity: .6; }
  .days { font-weight: 500; text-align: right; }
  .soon .days { color: var(--p-accent); font-weight: 600; }
  .rm { padding: 0; width: 44px; font-size: 20px; line-height: 1; }
  .scale { display: grid; grid-template-columns: minmax(6rem, 11rem) minmax(0, 1fr) 3rem 44px; gap: 8px; font-size: 12px; color: var(--p-muted); }
  .scale div:nth-child(2) { display: flex; justify-content: space-between; }
  .empty { padding: 16px 0; color: var(--p-muted); }

  .saved { display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: baseline; background: var(--p-surface); border-radius: var(--r-card); padding: 14px 16px; margin-bottom: 12px; }
  .saved b { font: 400 36px/1 var(--font-display); color: var(--p-accent); letter-spacing: -0.02em; }

  /* One card style for recipes: a minutes stub, a dashed tear line, then the details. */
  .card { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); background: var(--p-surface); border-radius: var(--r-card); margin-bottom: 12px; transition: transform 140ms ease-out; }
  .card:hover { transform: translateY(-2px); }
  .stub { border-right: 2px dashed var(--p-rule); padding: 12px 6px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .stub b { font: 400 30px/1 var(--font-display); }
  .stub span { font-size: 12px; color: var(--p-muted); }
  .tbody { padding: 12px 16px; min-width: 0; }
  .tbody h3 { font: 500 18px/1.25 var(--font-display); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chip { font-size: 13px; padding: 1px 8px; border-radius: 6px; background: var(--p-bg); border: 1px solid var(--p-rule); }
  .chip.hot { background: var(--p-accent); border-color: var(--p-accent); color: var(--p-accent-ink); }
  .note { font-size: 14px; color: var(--p-muted); margin: 2px 0; }

  .plan { list-style: none; margin: 0; padding: 0; }
  .plan li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--p-rule); }
  .plan .d { font-weight: 500; }
  .plan .d small { display: block; font-weight: 400; font-size: 13px; color: var(--p-muted); }
  .plan .none, .plan .meta { color: var(--p-muted); font-size: 14px; }
  #err { color: var(--p-accent); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) {
    header { animation: none; }
    .card, button { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Pantry Saver</h1>
  <p>List what is in your fridge and cupboards. Cook the food that expires first, and see how much food and money that keeps out of the bin.</p>
</header>
<main>
  <section aria-labelledby="h-pantry">
    <h2 id="h-pantry">Your shelf <small id="count"></small></h2>
    <form id="add" autocomplete="off">
      <div class="name"><label for="name">Item</label><input id="name" required maxlength="80" placeholder="spinach"></div>
      <div><label for="expiry">Best before</label><input id="expiry" type="date"></div>
      <div><label for="qty">Units</label><input id="qty" type="number" min="0.25" step="0.25" value="1"></div>
      <div><label for="storage">Stored in</label>
        <select id="storage"><option value="">auto</option><option>fridge</option><option>pantry</option><option>freezer</option></select></div>
      <button type="submit">Add item</button>
    </form>
    <div class="tools">
      <div><label for="hh">People at home</label><input id="hh" type="number" min="1" max="10" value="2"></div>
      <button type="button" class="ghost" id="sample">Load sample shelf</button>
      <button type="button" class="ghost" id="clear">Clear shelf</button>
    </div>
    <div id="err" role="alert"></div>
    <div class="scale" aria-hidden="true"><div>Item</div><div><span>today</span><span>1 week</span><span>2 weeks+</span></div><div></div><div></div></div>
    <ul class="runway" id="runway" aria-label="Items ordered by urgency"></ul>
  </section>
  <section aria-labelledby="h-cook">
    <h2 id="h-cook">Cook these first</h2>
    <div class="saved" id="saved" aria-live="polite"></div>
    <div id="tickets"></div>
    <h2 style="margin-top:24px">This week's dinners</h2>
    <ol class="plan" id="plan"></ol>
  </section>
</main>
</div>
<script>
const $ = id => document.getElementById(id);
const KEY = "pantry-saver-v1";
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { /* storage unavailable */ } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
  .then(r => { if (!r.ok) throw new Error(url + " " + r.status); return r.json(); });

async function refresh() {
  $("err").textContent = "";
  $("count").textContent = items.length + (items.length === 1 ? " item" : " items");
  if (!items.length) {
    $("runway").innerHTML = '<li class="empty">Nothing on the shelf yet. Add an item or load the sample.</li>';
    $("tickets").innerHTML = ""; $("plan").innerHTML = ""; $("saved").innerHTML = ""; return;
  }
  const base = { items, household_size: +$("hh").value || 2 };
  try {
    const [pr, rc, pl] = await Promise.all([post("/prioritize", base), post("/recipes", { ...base, limit: 4 }), post("/plan", base)]);
    drawRunway(pr.items); drawTickets(rc); drawPlan(pl);
  } catch (e) { $("err").textContent = "Could not reach the API: " + e.message; }
}

function drawRunway(list) {
  $("runway").innerHTML = list.map(i => {
    const cls = i.status === "expired" ? "expired" : i.days_left <= 2 ? "soon" : "";
    const w = Math.min(Math.max(i.days_left, 0), 14) / 14 * 100;
    const label = i.days_left < 0 ? "past" : i.days_left > 99 ? "99+d" : i.days_left + "d";
    return `<li class="row ${cls}"><div class="nm">${esc(i.name)}<i>${i.status}, ${(i.p_waste * 100).toFixed(0)}% bin risk</i></div>
      <div class="track" role="img" aria-label="${i.days_left} days left"><div class="bar" style="width:${w}%"></div></div>
      <div class="days">${label}</div><button class="ghost rm" data-i="${i.idx}" aria-label="Remove ${esc(i.name)}">&times;</button></li>`;
  }).join("");
}

function drawTickets(rc) {
  $("saved").innerHTML = rc.recipes.length
    ? `<b>${rc.best_waste_kg.toFixed(2)} kg</b><span>kept from the bin by the top pick, worth about ${rc.best_waste_value.toFixed(2)}</span>`
    : "<span>No recipe matches yet. Add more items.</span>";
  $("tickets").innerHTML = rc.recipes.map(r => `<article class="card">
      <div class="stub"><b>${r.minutes}</b><span>min</span></div>
      <div class="tbody"><h3>${esc(r.name)}</h3>
        <div class="chips">${r.uses.map(u => `<span class="chip ${u.days_left <= 3 ? "hot" : ""}">${esc(u.name)} ${u.days_left}d</span>`).join("")}</div>
        <div class="note">${r.missing.length ? "To buy: " + r.missing.map(esc).join(", ") : "Nothing to buy."}</div>
        <div class="note">Serves ${r.servings}. ${esc(r.steps)}</div></div></article>`).join("");
}

function drawPlan(pl) {
  const fmt = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric" });
  $("plan").innerHTML = pl.days.map(d => {
    const dt = fmt.format(new Date(d.date + "T12:00:00")).split(" ");
    const head = `<div class="d">${esc(dt[0])}<small>${esc(dt.slice(1).join(" "))}</small></div>`;
    return d.recipe
      ? `<li>${head}<div><b>${esc(d.recipe.name)}</b><div class="meta">${d.recipe.minutes} min, saves ${d.recipe.waste_kg.toFixed(2)} kg</div></div></li>`
      : `<li>${head}<div class="none">Nothing worth cooking from the shelf: shop or eat leftovers.</div></li>`;
  }).join("") + `<li><div class="d">Total</div><div><b>${pl.waste_kg.toFixed(2)} kg</b> saved, about ${pl.waste_value.toFixed(2)}`
    + (pl.left_over_at_risk.length ? `<div class="meta">Still at risk: ${pl.left_over_at_risk.slice(0, 6).map(i => esc(i.name)).join(", ")}</div>` : "") + "</div></li>";
}

$("add").addEventListener("submit", e => {
  e.preventDefault();
  const it = { name: $("name").value.trim(), quantity: +$("qty").value || 1 };
  if ($("expiry").value) it.expiry = $("expiry").value;
  if ($("storage").value) it.storage = $("storage").value;
  if (!it.name) return;
  items.push(it); save(); $("name").value = ""; $("name").focus(); refresh();
});
$("runway").addEventListener("click", e => {
  const b = e.target.closest(".rm"); if (!b) return;
  items.splice(+b.dataset.i, 1); save(); refresh();
});
$("sample").addEventListener("click", async () => {
  try { const s = await (await fetch("/sample")).json(); items = s.items; $("hh").value = s.household_size; save(); refresh(); }
  catch (e) { $("err").textContent = "Could not load sample."; }
});
$("clear").addEventListener("click", () => { items = []; save(); refresh(); });
$("hh").addEventListener("change", refresh);
if (!items.length) $("sample").click(); else refresh();
</script>
</body>
</html>
