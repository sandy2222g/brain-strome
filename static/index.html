<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b24;--ink:#e8edf5;--mute:#8e99ad;--cyan:#33e0ff;--hot:#ff5a6e;--cold:#4d8bff;--line:#262d3a}
@media(prefers-color-scheme:light){:root{--bg:#eef2f7;--card:#fff;--ink:#101828;--mute:#566074;--cyan:#0a8fb0;--hot:#d82a44;--cold:#2159d6;--line:#d5dce8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,sans-serif}
main{max-width:1000px;margin:auto;padding:24px 16px 56px}h1{font:800 clamp(1.9rem,7vw,3.2rem)/1.05 Unbounded;margin:0}h1 span{color:var(--cyan)}.sub{color:var(--mute);margin:8px 0 18px}
.ctl{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:16px}label{display:grid;gap:2px;font-size:.82rem;color:var(--mute)}label b{color:var(--ink)}input[type=range]{accent-color:var(--cyan);min-height:44px;width:220px}:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}.s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px}.s b{display:block;font:800 1.5rem Unbounded;color:var(--cyan)}.s span{font-size:.78rem;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin-bottom:14px}.panel h2{margin:0 0 8px;font:600 .95rem Unbounded}
table{border-collapse:separate;border-spacing:2px;min-width:640px}td.h,th{font-size:.68rem;color:var(--mute);font-weight:400;padding:0 4px;text-align:right}td.c{width:22px;height:22px;border-radius:3px}
.alert{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem;animation:in .3s both}.alert b.high{color:var(--hot)}.alert b.low{color:var(--cold)}
@keyframes in{from{opacity:0;transform:translateX(-6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main>
<h1>Power <span>Watch</span></h1><p class="sub">Two weeks of hourly electricity use as a baseline, two weeks to watch. Red is far above normal for that hour, blue far below.</p>
<div class="ctl"><label><span>Alert threshold <b id="tv">4.0</b></span><input type="range" id="t" min="2" max="9" step="0.5" value="4"></label><label><span>Hours in a row <b id="rv">2</b></span><input type="range" id="r" min="1" max="4" value="2"></label></div>
<div class="stats" id="st" aria-live="polite"></div>
<div class="panel"><h2>Unusualness by day and hour</h2><div id="g"></div></div>
<div class="panel"><h2>Alerts raised</h2><div id="al"></div></div></main>
<script>
const $=i=>document.getElementById(i);
const col=s=>{const a=Math.min(Math.abs(s)/10,1);const c=s>0?"255,90,110":"77,139,255";return `rgba(${c},${.08+a*.92})`};
async function go(){$("tv").textContent=(+$("t").value).toFixed(1);$("rv").textContent=$("r").value;
const d=await (await fetch(`/analyse?threshold=${$("t").value}&min_run=${$("r").value}`)).json();
const e=d.eval,n=d.naive_eval;
$("st").innerHTML=`<div class="s"><b>${e.faults_caught}/${e.faults}</b><span>real faults caught</span></div><div class="s"><b>${e.false_alarms}</b><span>false alarms</span></div><div class="s"><b>${n.faults_caught}/${n.faults}</b><span>caught by a flat 3-sigma rule</span></div><div class="s"><b>${n.false_alarms}</b><span>its false alarms</span></div>`;
let h="<table><tr><th></th>"+[...Array(24).keys()].map(x=>`<th>${x}</th>`).join("")+"</tr>";
for(let day=d.first_day;day<d.first_day+14;day++){h+=`<tr><td class="h">day ${day-d.first_day+1}</td>`;for(let x=0;x<24;x++){const c=d.cells[(day-d.first_day)*24+x];h+=`<td class="c" style="background:${col(c.score)}" title="day ${day-d.first_day+1} ${x}:00 · ${c.kwh} kWh · score ${c.score}${c.fault?" · "+c.fault:""}"></td>`}h+="</tr>"}
$("g").innerHTML=h+"</table>";
$("al").innerHTML=d.alerts.length?d.alerts.map(a=>`<div class="alert"><b class="${a.direction}">${a.direction==="high"?"Unusually high":"Unusually low"}</b> day ${a.day-d.first_day+1}, ${String(a.start).padStart(2,"0")}:00 for ${a.hours} h (peak score ${a.peak_score})</div>`).join(""):"No alerts at these settings."}
$("t").oninput=$("r").oninput=go;go();
</script></body></html>
