<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fair Teams Picker</title>
<style>
:root{--grass:#2e7d32;--grass2:#388e3c;--chalk:#f8f8f2;--ink:#12331a;--gold:#ffd54a}
*{box-sizing:border-box}body{margin:0;background:var(--grass);background-image:repeating-linear-gradient(90deg,var(--grass) 0 70px,var(--grass2) 70px 140px);color:var(--chalk);font:17px/1.4 "Futura","Century Gothic","Trebuchet MS",sans-serif}
main{max-width:820px;margin:0 auto;padding:28px 16px}h1{margin:0;font-size:2.2rem;text-transform:uppercase;letter-spacing:3px}p{opacity:.85}
.pitch{border:4px solid var(--chalk);margin:18px 0;display:grid;grid-template-columns:1fr 1fr;position:relative;background:#0b3d1455}
.pitch:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px solid var(--chalk)}
.team{padding:16px 20px}.team h2{margin:0 0 6px;font-size:.95rem;letter-spacing:2px;text-transform:uppercase}.team h2 b{float:right;color:var(--gold)}
.team div{padding:3px 0}.team span{opacity:.7;font-size:.85rem;margin-left:6px}
.lbl{text-transform:uppercase;letter-spacing:2px;font-size:.8rem;margin-top:22px;opacity:.8}
.bad{background:var(--ink);padding:10px 14px;border-left:6px solid var(--gold);margin-top:8px}
@media(max-width:600px){.pitch{grid-template-columns:1fr}.pitch:after{display:none}}
</style></head><body><main>
<h1>Fair teams</h1><p id="sub"></p>
<div class="lbl">Best split</div><div class="pitch" id="best"></div>
<div class="lbl">Captains pick in turn</div><div class="pitch" id="alt"></div><div class="bad" id="bad"></div></main>
<script>
(async()=>{
  const s=await (await fetch("/sample")).json();
  const sk=Object.fromEntries(s.players.map(p=>[p.name,p.skill]));
  const r=await (await fetch("/split",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  const team=(t,names,tot)=>`<div class="team"><h2>${t}<b>${tot}</b></h2>${names.map(n=>`<div>${n}<span>${sk[n]}</span></div>`).join("")}</div>`;
  const show=(id,x)=>document.getElementById(id).innerHTML=team("Team A",x.team_a,x.skill_a)+team("Team B",x.team_b,x.skill_b);
  document.getElementById("sub").textContent=`${s.players.length} players. Keep apart: ${s.keep_apart.map(p=>p.join(" & "))}. Keep together: ${s.keep_together.map(p=>p.join(" & "))}.`;
  show("best",r.best);show("alt",r.captains_pick);
  document.getElementById("bad").textContent=`Skill gap ${r.best.gap} against ${r.captains_pick.gap}. Captains' picks: ${r.captains_broken_rules.join("; ")||"no rules broken"}.`;
})();
</script></body></html>
