<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Guesser</title>
<style>
:root{--bg:#fff;--ink:#111;--pink:#ff3d81;--blue:#2740ff;--yel:#ffe14d;--mut:#666}
*{box-sizing:border-box}body{margin:0;background:var(--yel);color:var(--ink);font:16px/1.45 "Helvetica Neue",Arial,sans-serif;padding:34px 18px}
main{max-width:860px;margin:auto}h1{font:900 58px/0.95 "Arial Black",Impact,sans-serif;margin:0 0 6px;letter-spacing:-2px;text-transform:uppercase}h1 span{background:var(--pink);color:#fff;padding:0 8px}
p.s{font-weight:600;margin:10px 0 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips button{font:700 14px inherit;font-family:inherit;border:3px solid #111;background:#fff;padding:5px 12px;cursor:pointer;box-shadow:3px 3px 0 #111}.chips button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
textarea{width:100%;height:96px;font:600 20px "Helvetica Neue",Arial;border:4px solid #111;padding:12px;background:#fff;box-shadow:6px 6px 0 #111;resize:vertical}
.res{margin-top:24px;background:#fff;border:4px solid #111;box-shadow:6px 6px 0 #111;padding:18px 22px}
.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}.top b{font:900 54px "Arial Black",sans-serif;color:var(--blue);line-height:1}.top span{font-weight:700;color:var(--mut)}
.r{display:grid;grid-template-columns:90px 1fr 50px;gap:10px;align-items:center;margin:6px 0;font-weight:700}.r i{display:block;height:18px;background:var(--pink);border:2px solid #111;min-width:2px}.r:first-of-type i{background:var(--blue)}
.m{margin-top:18px;font-size:14px;font-weight:600}.m b{background:#fff;padding:0 4px;border:2px solid #111}
</style></head><body><main>
<h1>Which <span>language</span> is this?</h1><p class="s">Type or paste a sentence. English, Spanish, French, German or Italian.</p>
<div class="chips" id="ch"></div><textarea id="tx" placeholder="Escribe algo, écris quelque chose, schreib etwas…"></textarea>
<div class="res"><div class="top" id="top"></div><div id="rk"></div></div>
<p class="m" id="ev"></p></main>
<script>
const $=i=>document.getElementById(i);let tm;
async function go(){const t=$('tx').value;if(!t.trim()){$('top').innerHTML='<span>Waiting for text…</span>';$('rk').innerHTML='';return}
const r=await (await fetch('/guess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})})).json();
$('top').innerHTML=`<b>${r.language}</b><span>${Math.round(r.confidence*100)}% sure</span>`;
$('rk').innerHTML=r.ranking.map(x=>`<div class="r"><span>${x.language}</span><i style="width:${x.p*100}%"></i><span>${Math.round(x.p*100)}%</span></div>`).join('')}
fetch('/examples').then(r=>r.json()).then(d=>{$('ch').innerHTML=d.examples.map(e=>`<button>${e.language} example</button>`).join('');
$('ch').onclick=ev=>{const i=[...$('ch').children].indexOf(ev.target.closest('button'));if(i>=0){$('tx').value=d.examples[i].text;go()}};$('tx').value=d.examples[3].text;go()});
$('tx').oninput=()=>{clearTimeout(tm);tm=setTimeout(go,150)};
fetch('/evaluation').then(r=>r.json()).then(e=>{$('ev').innerHTML=`On ${e.test_sentences} unseen sentences: letter-triples <b>${Math.round(e.trigram*100)}%</b> right, single letters <b>${Math.round(e.unigram*100)}%</b>. On just the first 20 characters: <b>${Math.round(e.trigram_short*100)}%</b> vs <b>${Math.round(e.unigram_short*100)}%</b> (guessing: ${Math.round(e.chance*100)}%).`});
</script></body></html>
