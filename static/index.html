<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Price Checker</title>
<style>
:root{--bg:#fff;--ink:#111;--red:#e1251b;--tag:#fff200;--mute:#666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Arial Narrow",Arial,sans-serif}
header{background:var(--red);color:#fff;padding:22px 16px}header h1{max-width:760px;margin:0 auto;font-size:2rem;text-transform:uppercase;letter-spacing:1px}
main{max-width:760px;margin:0 auto;padding:20px 16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tag{border:3px solid var(--ink);padding:12px;background:var(--tag);position:relative}.tag.best{background:#9be564}
.tag small{display:block;color:var(--mute)}.big{font-size:2.2rem;font-weight:bold;line-height:1.1}
.pill{position:absolute;top:-10px;right:8px;background:var(--red);color:#fff;font-size:.75rem;padding:2px 8px}
.note{margin-top:20px;padding:12px;border:2px dashed var(--red)}
</style></head><body><header><h1>Unit price checker</h1></header><main>
<div class="shelf" id="out"></div><div class="note" id="note"></div></main>
<script>
(async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/compare",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  document.getElementById("out").innerHTML=r.rows.map(x=>`<div class="tag ${x.name===r.best?"best":""}">${x.name===r.best?'<span class="pill">BEST VALUE</span>':""}<small>${x.name}</small><div class="big">${x.per_100.toFixed(3)}</div><small>per 100 g · shelf price ${x.price.toFixed(2)}${x.extra_pct?` · +${x.extra_pct}%`:""}</small></div>`).join("");
  document.getElementById("note").textContent=r.largest===r.best?"Here the biggest pack is also the best value.":`The biggest pack (${r.largest}) is not the best value: ${r.best} is cheaper per 100 g.`;
})();
</script></body></html>
