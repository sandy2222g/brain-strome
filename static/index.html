<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Routine Planner</title>
<style>
:root{--ink:#3d1f2b;--paper:#fff7f0;--bar:#e4572e;--free:#f2b134;--mute:#8c6a73}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#ffd9b8,#ffb7a1 45%,#e98a9b);min-height:100vh;color:var(--ink);font:16px/1.4 "Optima","Candara","Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:30px 16px}h1{margin:0;font-size:2.3rem;font-weight:300;letter-spacing:1px}p{margin:4px 0 0}
.big{display:flex;gap:30px;margin:22px 0;flex-wrap:wrap}.big div b{display:block;font-size:3rem;line-height:1;font-weight:300}.big div span{font-size:.85rem;opacity:.8}
.card{background:#fff7f0e8;border-radius:14px;padding:16px 18px}
.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;margin:5px 0;font-size:.9rem}
.track{position:relative;height:20px;background:#0000000d;border-radius:4px}.seg{position:absolute;height:100%;background:var(--bar);border-radius:4px}.seg.f{background:var(--free)}
.axis{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute);margin-left:130px;margin-top:4px}
.note{margin-top:14px;font-size:.9rem}
</style></head><body><main>
<h1>When must I get up?</h1><p id="sub"></p>
<div class="big" id="big"></div>
<div class="card"><div id="gantt"></div><div class="axis" id="axis"></div><div class="note" id="note"></div></div></main>
<script>
(async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({leave:s.leave,tasks:s.tasks})})).json();
  document.getElementById("sub").textContent=`Out of the door at ${s.leave}. Orange: you are busy. Amber: it happens on its own.`;
  document.getElementById("big").innerHTML=`<div><b>${r.wake}</b><span>wake up</span></div><div><b>${r.total} min</b><span>start to door</span></div><div><b>${r.wake_one_at_a_time}</b><span>if everything is done one by one</span></div>`;
  document.getElementById("gantt").innerHTML=r.rows.map(x=>`<div class="row"><div>${x.name}</div><div class="track"><div class="seg ${x.hands_free?"f":""}" style="left:${x.start/r.total*100}%;width:${(x.end-x.start)/r.total*100}%"></div></div></div>`).join("");
  document.getElementById("axis").innerHTML=`<span>${r.wake}</span><span>${s.leave}</span>`;
  document.getElementById("note").textContent=`Even with unlimited helpers the routine could not be shorter than ${r.lower_bound} min (kettle, coffee, breakfast, teeth, coat).`;
})();
</script></body></html>
