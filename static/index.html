<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9c2a0;--paper:#f7ecd9;--ink:#23311f;--red:#b3261e;--pine:#1f4d36;--mute:#5d5646}
@media(prefers-color-scheme:dark){:root{--bg:#14231a;--paper:#1d3226;--ink:#f1e7d1;--red:#ff6b5e;--pine:#8fd1a8;--mute:#b3bba9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Karla,sans-serif}
main{max-width:900px;margin:auto;padding:24px 16px 56px}h1{font:clamp(2rem,7vw,3.6rem)/1.05 "Young Serif",serif;margin:0;color:var(--red)}.sub{color:var(--mute);margin:6px 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}button{min-height:44px;padding:0 22px;border:0;background:var(--pine);color:#fff;font:700 1rem Karla;cursor:pointer;border-radius:6px;transition:transform 150ms}
@media(prefers-color-scheme:dark){button{color:#10201a}}button:hover{transform:translateY(-2px)}button:active{transform:none}:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:14px}
.tag{background:var(--paper);padding:14px;border-radius:4px;position:relative;border-top:10px solid var(--red);box-shadow:0 2px 0 rgba(0,0,0,.15);animation:in .3s both}
.tag:before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;margin-left:-5px;background:var(--bg);border-radius:50%}
@keyframes in{from{opacity:0;transform:translateY(6px) rotate(-1deg)}}
.to{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}.who{font:1.4rem "Young Serif"}.arrow{color:var(--red);font-weight:700}
.rules{background:var(--paper);padding:12px 16px;border-radius:4px;font-size:.9rem;margin-top:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<h1>Gift Draw</h1><p class="sub">Secret Santa with no self-gifts, no couples, and no repeat of last year.</p>
<div class="bar"><button id="go">Draw again</button><span id="n" aria-live="polite"></span></div>
<div class="grid" id="g" aria-live="polite"></div><div class="rules" id="r"></div></main>
<script>
const $=i=>document.getElementById(i);let s;
async function init(){s=await (await fetch("/sample")).json();
$("r").innerHTML=`<b>Rules in play:</b> ${s.exclusions.map(p=>p.join(" + ")).join(", ")} never draw each other, and nobody gets last year's person.`;go()}
async function go(){const r=await fetch("/draw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)});const d=await r.json();
if(!r.ok){$("g").textContent=d.detail;return}
$("n").textContent=`${d.possible_draws.toLocaleString()} valid draws exist for this group`;
$("g").innerHTML=Object.entries(d.assignments).map(([a,b],i)=>`<div class="tag" style="animation-delay:${i*40}ms"><div class="to">${a} gives to</div><div class="who"><span class="arrow">→</span> ${b}</div></div>`).join("")}
$("go").onclick=go;init();
</script></body></html>
