<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chase Win Estimator</title>
<style>
:root{--grass:#1f5a2d;--grass2:#27693a;--chalk:#f6f4ea;--gold:#f2c230;--red:#d94b3d}
*{box-sizing:border-box}body{margin:0;color:var(--chalk);font:16px/1.5 "Gill Sans","Trebuchet MS",sans-serif;padding:28px;
background:repeating-linear-gradient(90deg,var(--grass) 0 70px,var(--grass2) 70px 140px) fixed}
main{max-width:940px;margin:auto}h1{font-size:34px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:400;border-bottom:3px solid var(--chalk);display:inline-block;padding-bottom:2px}
p.s{margin:8px 0 20px;opacity:.85}.board{background:#101c14e6;border:4px solid var(--chalk);border-radius:6px;padding:18px 22px}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
label{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.75;display:block}
input,select{width:100%;font:inherit;font-size:22px;font-weight:700;background:#0008;color:var(--gold);border:1px solid #fff5;border-radius:4px;padding:4px 8px}select option{color:#000}
button{background:var(--gold);color:#2a2000;border:0;border-radius:4px;padding:10px 22px;font-weight:800;cursor:pointer;font-size:15px;margin-top:6px}
.res{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:20px}@media(max-width:760px){.res{grid-template-columns:1fr}}
.big{font-size:92px;font-weight:800;line-height:1;color:var(--gold)}.big small{font-size:22px;color:var(--chalk)}
.meter{height:18px;background:#fff2;border-radius:9px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold),#6fd16f)}
.row{display:flex;justify-content:space-between;border-bottom:1px dashed #fff4;padding:5px 0}.row b{color:var(--gold)}
h2{font-size:12px;letter-spacing:3px;text-transform:uppercase;margin:0 0 6px;opacity:.75}.note{font-size:13px;opacity:.8;margin-top:10px}#err{color:#ffb0a8}
</style></head><body><main>
<h1>Chase Win Estimator</h1><p class="s">Exact chances from the match situation — every ball, every wicket, no guesswork.</p>
<div class="board"><div class="inputs">
<div><label>Target</label><input id="t" type="number"></div><div><label>Runs now</label><input id="r" type="number"></div>
<div><label>Wickets lost</label><input id="w" type="number"></div><div><label>Balls left</label><input id="b" type="number"></div>
<div><label>Batting style</label><select id="p"><option>balanced</option><option>aggressive</option><option>defensive</option></select></div></div>
<button id="go">Work out the odds</button> <span id="err"></span>
<div class="res"><div><h2>Chasing side wins</h2><div class="big" id="pr"></div><div class="meter"><i id="m"></i></div></div>
<div><h2>By batting style</h2><div id="bp"></div><h2 style="margin-top:14px">Run-rate rule of thumb</h2><div id="bl"></div></div></div>
<p class="note" id="note"></p></div></main>
<script>
const $=i=>document.getElementById(i);
async function run(){$('err').textContent='';const body={preset:$('p').value,target:+$('t').value,runs:+$('r').value,wickets:+$('w').value,balls_left:+$('b').value};
const res=await fetch('/estimate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await res.json();if(!res.ok){$('err').textContent=j.detail;return}
const pc=j.win_probability*100;$('pr').innerHTML=`${pc.toFixed(1)}<small>%</small>`;$('m').style.width=pc+'%';
$('bp').innerHTML=Object.entries(j.by_preset).map(([k,v])=>`<div class="row"><span>${k}</span><b>${(v*100).toFixed(1)}%</b></div>`).join('');
const b=j.baseline;$('bl').innerHTML=`<div class="row"><span>Needed per over</span><b>${b.required_rate}</b></div><div class="row"><span>Scored per over so far</span><b>${b.current_rate}</b></div><div class="row"><span>Verdict</span><b>${b.verdict}</b></div>`;
$('note').textContent=`The rule of thumb gives a yes/no and ignores wickets. The dynamic programme gives the chance: ${pc.toFixed(1)}%.`}
fetch('/sample').then(r=>r.json()).then(d=>{const s=d.scenario;$('t').value=s.target;$('r').value=s.runs;$('w').value=s.wickets;$('b').value=s.balls_left;$('p').value=s.preset;run()});
$('go').onclick=run;
</script></body></html>
