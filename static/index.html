<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receipt Line Reader</title>
<style>
:root{--bg:#d9dde3;--paper:#fdfcf7;--ink:#222;--warn:#d9480f;--ok:#2b8a3e;--mut:#6b7078}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:30px 18px}
main{max-width:980px;margin:auto}h1{font:700 30px "Courier New",monospace;margin:0;letter-spacing:-1px}p.s{color:var(--mut);margin:4px 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{font:13px "Courier New",monospace;background:#fff;border:1px solid #b9bec7;border-radius:6px;padding:4px 10px;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}@media(max-width:780px){.grid{grid-template-columns:1fr}}
textarea{width:100%;height:340px;font:14px/1.5 "Courier New",monospace;background:var(--paper);border:0;padding:20px 18px;box-shadow:0 6px 16px #0003;resize:vertical;clip-path:polygon(0 0,100% 0,100% 97%,96% 100%,92% 97%,88% 100%,84% 97%,80% 100%,76% 97%,72% 100%,68% 97%,64% 100%,60% 97%,56% 100%,52% 97%,48% 100%,44% 97%,40% 100%,36% 97%,32% 100%,28% 97%,24% 100%,20% 97%,16% 100%,12% 97%,8% 100%,4% 97%,0 100%)}
.card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 4px 12px #0002}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid #eee;text-align:left}th{font-size:12px;text-transform:uppercase;color:var(--mut)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:700;border-top:2px solid var(--ink)}.flag{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px}.flag.bad{background:#fff0e6;color:var(--warn);border-left:5px solid var(--warn)}.flag.good{background:#ebfbee;color:var(--ok);border-left:5px solid var(--ok)}
.m{font-size:13px;color:var(--mut);margin-top:14px}.m b{color:var(--ink)}
</style></head><body><main>
<h1>RECEIPT LINE READER</h1><p class="s">Paste receipt text. It extracts the items, then checks the maths.</p>
<div class="tabs" id="tabs"></div>
<div class="grid"><textarea id="tx" spellcheck="false"></textarea>
<div class="card"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Line total</th></tr></thead><tbody id="rows"></tbody></table><div id="fl"></div></div></div>
<p class="m" id="ev"></p></main>
<script>
const $=i=>document.getElementById(i);let tm;const $$=c=>(c/100).toFixed(2);
const LAB={items_sum_mismatch:'The items do not add up to the printed subtotal.',total_mismatch:'Subtotal + tax + tip does not equal the printed total.'};
async function go(){const r=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('tx').value})});
if(!r.ok){$('rows').innerHTML='';$('fl').innerHTML='';return}const j=await r.json(),t=j.totals;
let h=j.items.map(i=>`<tr><td>${i.name.replace(/</g,'&lt;')}</td><td class="n">${i.qty}</td><td class="n">${$$(i.total_cents)}</td></tr>`).join('');
const row=(l,v)=>v==null?'':`<tr class="sum"><td colspan="2">${l}</td><td class="n">${$$(v)}</td></tr>`;
h+=row('Subtotal',t.subtotal)+(t.tax?row('Tax',t.tax).replace(' class="sum"',''):'')+(t.tip?row('Tip',t.tip).replace(' class="sum"',''):'')+row('Total',t.total);$('rows').innerHTML=h;
$('fl').innerHTML=j.issues.length?j.issues.map(i=>`<div class="flag bad">&#9888; ${LAB[i]}</div>`).join(''):'<div class="flag good">&#10003; Arithmetic checks out.</div>'}
fetch('/samples').then(r=>r.json()).then(d=>{const S=d.samples;$('tabs').innerHTML=S.map((s,i)=>`<button data-i="${i}">Receipt ${s.id}</button>`).join('');
const pick=i=>{$('tx').value=S[i].text;[...$('tabs').children].forEach((b,k)=>b.classList.toggle('on',k===i));go()};$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.i)};pick(3)});
$('tx').oninput=()=>{clearTimeout(tm);tm=setTimeout(go,200)};
fetch('/evaluation').then(r=>r.json()).then(e=>{$('ev').innerHTML=`On ${e.items} items in ${e.receipts} sample receipts: this parser <b>${Math.round(e.parser_accuracy*100)}%</b> correct vs <b>${Math.round(e.baseline_accuracy*100)}%</b> for a one-pattern baseline; arithmetic problems found correctly on <b>${e.issue_detection}</b> receipts.`});
</script></body></html>
