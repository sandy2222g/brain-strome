<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transit Pass Chooser</title>
<style>
:root{--bg:#f4efe3;--ink:#1b2a41;--accent:#d1495b;--card:#fffaf0;--line:#1b2a41}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
main{max-width:860px;margin:0 auto;padding:32px 16px}
h1{font-size:2.2rem;margin:0}p.sub{margin:.3rem 0 1.5rem}
button{background:var(--ink);color:var(--bg);border:0;padding:.6rem 1.2rem;font:inherit;cursor:pointer}
.ticket{background:var(--card);border:2px solid var(--line);border-left:12px solid var(--accent);margin:14px 0;padding:12px 16px}
.ticket h2{margin:0;font-size:1.15rem}.best{color:var(--accent);font-weight:bold}
.bars{display:grid;grid-template-columns:100px 1fr 70px;gap:4px 8px;align-items:center;margin-top:8px;font:13px monospace}
.bar{height:12px;background:#c9c2b0}.bar.win{background:var(--accent)}
</style></head><body><main>
<h1>Transit Pass Chooser</h1>
<p class="sub">Four weeks of rides in, the cheapest fare option out.</p>
<button id="go">Run sample riders</button><div id="out"></div></main>
<script>
const out=document.getElementById("out");
document.getElementById("go").onclick=async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/choose",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  out.innerHTML="";
  for(const x of r.riders){
    const max=Math.max(...Object.values(x.costs));
    const d=document.createElement("div");d.className="ticket";
    let h=`<h2>${x.name} <span class="best">&rarr; ${x.best.replace("_"," ")}</span></h2><div>${x.rides} rides in 4 weeks; saves $${x.saving_vs_single.toFixed(2)} vs paying singles</div><div class="bars">`;
    for(const [o,c] of Object.entries(x.costs))h+=`<span>${o}</span><div class="bar ${o===x.best?"win":""}" style="width:${c/max*100}%"></div><span>$${c.toFixed(2)}</span>`;
    d.innerHTML=h+"</div>";out.appendChild(d);
  }
};
document.getElementById("go").click();
</script></body></html>
