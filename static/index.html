<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting Notes Summarizer</title>
<style>
:root{--bg:#fdf6e3;--ink:#3b2f2f;--mark:#fff176;--pen:#c2185b;--line:#e8dcc0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Georgia,"Times New Roman",serif;padding:34px 20px}
main{max-width:1040px;margin:auto}h1{font-size:36px;margin:0;font-weight:400;font-style:italic}p.s{margin:2px 0 20px;opacity:.7}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}select,button{font:inherit;font-size:15px;padding:6px 14px;border:1px solid var(--ink);border-radius:2px;background:#fff}button{background:var(--ink);color:#fff;cursor:pointer}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.doc{background:#fff;border:1px solid var(--line);padding:22px 26px;box-shadow:4px 4px 0 var(--line)}.doc span{display:inline;padding:1px 0}.doc span.pick{background:var(--mark)}
.doc span.lead{text-decoration:underline wavy #90a4ae;text-underline-offset:4px}
h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:0 0 8px;color:var(--pen);font-family:Arial,sans-serif}
.act{background:#fff;border-left:4px solid var(--pen);padding:8px 14px;margin-bottom:8px;font-size:15px}.act b{color:var(--pen)}
.sum{background:#fffde7;border:1px dashed #d4c26a;padding:10px 14px;margin-bottom:16px;font-size:15px}
.legend{font-size:12px;font-family:Arial,sans-serif;opacity:.75;margin-top:10px}.m{font-size:13px;margin-top:20px;font-family:Arial,sans-serif;opacity:.8}
</style></head><body><main>
<h1>Meeting Notes Summarizer</h1><p class="s">TextRank picks the sentences that matter; a pattern finds who owes what.</p>
<div class="top"><select id="sel"></select><button id="go">Summarise</button></div>
<div class="cols"><div><h2>Transcript</h2><div class="doc" id="doc"></div><p class="legend"><span style="background:var(--mark)">highlight</span> = chosen by TextRank &nbsp; <span style="text-decoration:underline wavy #90a4ae">wavy</span> = first three sentences (baseline)</p></div>
<div><h2>Summary</h2><div class="sum" id="sum"></div><h2>Action items</h2><div id="act"></div><p class="m" id="m"></p></div></div></main>
<script>
let D;const $=i=>document.getElementById(i);
async function run(){const m=D.meetings[$('sel').value];
const j=await (await fetch('/summarise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:m.text,k:3})})).json();
$('doc').innerHTML=j.sentences.map((s,i)=>`<span class="${j.chosen.includes(i)?'pick':''} ${j.lead_baseline.includes(i)?'lead':''}">${s}</span>`).join(' ');
$('sum').innerHTML=j.summary.map(s=>`<div>• ${s}</div>`).join('');
$('act').innerHTML=j.actions.length?j.actions.map(a=>`<div class="act"><b>${a.owner}</b> — ${a.task}${a.due?` <i>(by ${a.due})</i>`:''}</div>`).join(''):'<div class="act">None found.</div>'}
fetch('/sample').then(r=>r.json()).then(d=>{D=d;$('sel').innerHTML=d.meetings.map((m,i)=>`<option value="${i}">${m.title}</option>`).join('');run()});
fetch('/metrics').then(r=>r.json()).then(m=>{$('m').textContent=`On ${m.meetings} labelled meetings, ${(m.textrank_precision*100).toFixed(0)}% of TextRank's picks were key sentences vs ${(m.lead_precision*100).toFixed(0)}% for "first three sentences" (tiny test set).`});
$('go').onclick=run;$('sel').onchange=run;
</script></body></html>
