<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Hive Solver</title>
<style>
:root{--bg:#fff8e1;--ink:#3b2a00;--honey:#f7c600;--cell:#e9e2c8;--mute:#8a7a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Rockwell","Georgia",serif}
main{max-width:880px;margin:0 auto;padding:28px 16px;display:grid;grid-template-columns:300px 1fr;gap:34px}
h1{grid-column:1/-1;margin:0;font-size:2.2rem}p{color:var(--mute);margin:0}
.hive{position:relative;width:280px;height:300px;margin-top:10px}
.hx{position:absolute;width:86px;height:98px;background:var(--cell);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;text-transform:uppercase}
.hx.mid{background:var(--honey)}
.words{columns:3;column-gap:20px;margin:6px 0 0;padding:0;list-style:none}.words li{padding:2px 0;break-inside:avoid}
.words li.pg{font-weight:bold;background:var(--honey);padding:2px 6px;border-radius:4px;margin-bottom:4px}.words small{color:var(--mute)}
.stat{margin-top:8px}.stat b{font-size:1.6rem}
@media(max-width:700px){main{grid-template-columns:1fr}.words{columns:2}}
</style></head><body><main>
<h1>Word hive solver</h1>
<div><p id="sub"></p><div class="hive" id="hive"></div><div class="stat" id="stat"></div></div>
<div><p>Pangrams (all seven letters) are highlighted.</p><ul class="words" id="words"></ul></div></main>
<script>
(async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/solve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({letters:s.letters,center:s.center})})).json();
  const others=[...s.letters].filter(l=>l!==s.center);
  const pos=[[97,0],[97,200],[0,50],[194,50],[0,150],[194,150]]; // approximate hex ring
  const ring=[[97,0],[190,50],[190,150],[97,200],[4,150],[4,50]];
  document.getElementById("hive").innerHTML=ring.map((p,i)=>`<div class="hx" style="left:${p[0]}px;top:${p[1]}px">${others[i]}</div>`).join("")+`<div class="hx mid" style="left:97px;top:100px">${s.center}</div>`;
  document.getElementById("sub").textContent="Words of four or more letters, always using the gold letter.";
  document.getElementById("stat").innerHTML=`<b>${r.count}</b> words · <b>${r.total_points}</b> points`;
  document.getElementById("words").innerHTML=r.words.map(w=>`<li class="${w.pangram?"pg":""}">${w.word} <small>${w.points}</small></li>`).join("");
})();
</script></body></html>
