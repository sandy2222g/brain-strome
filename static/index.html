<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Park Fee Comparator</title>
<style>
:root{--bg:#1d2b53;--ink:#fdf6e3;--accent:#ffd23f;--card:#2a3a6b;--mute:#a9b6e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Arial Black",Impact,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px}
h1{margin:0;font-size:2.2rem;color:var(--accent);text-transform:uppercase}p{color:var(--mute);font-family:Arial,sans-serif}
button{background:var(--accent);color:var(--bg);border:0;padding:.6rem 1.3rem;font:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px;font-family:Arial,sans-serif}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #3b4d85}th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:normal;text-transform:uppercase;font-size:.8rem}
td.win{background:var(--accent);color:var(--bg);font-weight:bold}
</style></head><body><main>
<h1>Car Park Fee Comparator</h1>
<p>The cheapest car park changes with how long you stay.</p>
<button id="go">Compare the sample car parks</button><div id="out"></div></main>
<script>
const out=document.getElementById("out"),len=m=>m>=60?`${m/60} h`:`${m} min`;
document.getElementById("go").onclick=async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/compare",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  const names=Object.keys(r.rows[0].fees);
  let h="<table><tr><th>Stay</th>"+names.map(n=>`<th>${n}</th>`).join("")+"</tr>";
  for(const x of r.rows)h+=`<tr><td>${len(x.minutes)}</td>`+names.map(n=>`<td class="${n===x.best?"win":""}">$${x.fees[n].toFixed(2)}</td>`).join("")+"</tr>";
  out.innerHTML=h+"</table>";
};
document.getElementById("go").click();
</script></body></html>
