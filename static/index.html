<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paint Can Planner</title>
<style>
:root{--bg:#10231f;--ink:#f1f7f4;--accent:#f2c14e;--card:#17332d;--mute:#9bb8ae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px}
h1{margin:0;font-size:2rem;letter-spacing:-.02em}p{color:var(--mute)}
button{background:var(--accent);color:#10231f;border:0;border-radius:999px;padding:.6rem 1.4rem;font:600 1rem system-ui;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);border-radius:16px;padding:16px}.card.win{outline:3px solid var(--accent)}
.card h2{margin:0;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.cost{font-size:2.2rem;font-weight:700}.tins{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tin{background:var(--accent);color:#10231f;border-radius:4px 4px 8px 8px;padding:2px 8px;font:600 13px system-ui}
.tin.dim{background:#46635a;color:var(--ink)}
</style></head><body><main>
<h1>Paint Can Planner</h1>
<p id="need">How many tins, and which sizes, for the cheapest total?</p>
<button id="go">Plan the sample job</button><div class="grid" id="out"></div></main>
<script>
const out=document.getElementById("out");
document.getElementById("go").onclick=async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  document.getElementById("need").textContent=`Sample job needs ${r.litres} L of paint.`;
  out.innerHTML="";
  for(const [k,t] of [["optimal","Cheapest mix"],["largest_only","Biggest tin only"],["smallest_only","Smallest tin only"]]){
    const p=r[k],d=document.createElement("div");d.className="card"+(k==="optimal"?" win":"");
    let h=`<h2>${t}</h2><div class="cost">$${p.cost.toFixed(2)}</div><div class="tins">`;
    for(const [sz,n] of Object.entries(p.cans))h+=`<span class="tin ${k==="optimal"?"":"dim"}">${n} &times; ${sz} L</span>`;
    d.innerHTML=h+"</div>";out.appendChild(d);
  }
};
document.getElementById("go").click();
</script></body></html>
