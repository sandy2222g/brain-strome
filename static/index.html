<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate Limiter Lab</title>
<style>
:root{--bg:#0e1a2b;--panel:#16263d;--ink:#e6eef8;--mint:#5ee3b0;--red:#ff6b6b;--dim:#7d93b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 18px}h1{margin:0;font-size:26px;font-weight:600}h1 b{color:var(--mint)}.sub{color:var(--dim);margin:2px 0 18px}
.bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}button{background:var(--panel);color:var(--ink);border:1px solid #2c4468;border-radius:20px;padding:5px 16px;cursor:pointer;font:inherit}button.on{background:var(--mint);color:#06281c;border-color:var(--mint)}
.lane{background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:12px}.lane h2{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}.lane h2 span{color:var(--dim);font-weight:400}
canvas{width:100%;height:46px;display:block}.why{color:var(--dim);font-size:13px;margin-top:4px}
</style></head><body><main>
<h1><b>Rate limiter</b> lab</h1><p class="sub">The same 60 seconds of traffic, limit 10 requests per 10 s. Green = allowed, red = rejected.</p>
<div class="bar" id="kinds"></div><div id="lanes"></div>
</main><script>
const $=i=>document.getElementById(i);let kind='edge';
const why={fixed_window:'Cheapest: one counter. But a burst on each side of a window edge slips through at double the limit.',sliding_log:'Exact: never more than the limit in any 10 s span. Costs memory for every timestamp.',token_bucket:'Allows a short burst then enforces the average rate. Used by most real APIs.'};
async function load(){const j=await (await fetch('/compare?kind='+kind)).json();
document.querySelectorAll('#kinds button').forEach(b=>b.classList.toggle('on',b.dataset.k===kind));
$('lanes').innerHTML=j.rows.map(r=>`<div class="lane"><h2>${r.algorithm.replace('_',' ')}<span>allowed ${r.allowed} of ${r.requests}; worst 10 s span: ${r.worst_span} (limit ${r.limit})</span></h2><canvas data-a="${r.algorithm}" width="1000" height="46"></canvas><div class="why">${why[r.algorithm]}</div></div>`).join('');
document.querySelectorAll('canvas').forEach(cv=>{const x=cv.getContext('2d'),tl=j.timeline[cv.dataset.a];j.times.forEach((t,i)=>{x.fillStyle=tl[i]?'#5ee3b0':'#ff6b6b';x.fillRect(t/60*996,tl[i]?4:24,3,18)})})}
$('kinds').innerHTML=['edge','bursty','steady'].map(k=>`<button data-k="${k}">${k} traffic</button>`).join('');
$('kinds').onclick=e=>{if(e.target.dataset.k){kind=e.target.dataset.k;load()}};load();
</script></body></html>
