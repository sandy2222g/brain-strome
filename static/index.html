<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Goal Planner</title>
<style>
:root{--bg:#efe9fb;--ink:#2a1a4d;--accent:#6a3dd1;--card:#fff;--mute:#6f5f96}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next",Avenir,system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px}
h1{margin:0;font-size:2.1rem}p{color:var(--mute)}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:.65rem 1.4rem;font:600 1rem system-ui;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.stat{background:var(--card);border-radius:14px;padding:14px}.stat b{display:block;font-size:1.8rem;color:var(--accent)}
.stat span{color:var(--mute);font-size:.85rem}
svg{width:100%;background:var(--card);border-radius:14px;margin-top:14px}
</style></head><body><main>
<h1>Savings Goal Planner</h1>
<p id="sub">How long to reach the goal, and what to put in each month.</p>
<button id="go">Plan the sample goal</button><div id="out"></div></main>
<script>
const out=document.getElementById("out");
document.getElementById("go").onclick=async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  document.getElementById("sub").textContent=`Goal $${s.goal}, starting with $${s.start}, saving $${s.monthly} a month at ${(s.annual_rate*100).toFixed(0)}% a year.`;
  const c=r.curve,W=760,H=240,P=30,max=Math.max(s.goal,...c);
  const x=i=>P+i*(W-2*P)/(c.length-1),y=v=>H-P-v/max*(H-2*P);
  const pts=c.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  out.innerHTML=`<div class="stats">
  <div class="stat"><b>${r.months_with_interest} months</b><span>with interest</span></div>
  <div class="stat"><b>${r.months_without_interest} months</b><span>ignoring interest</span></div>
  <div class="stat"><b>$${r.required_monthly.toFixed(2)}</b><span>a month to hit it in ${s.target_months} months (with interest)</span></div>
  <div class="stat"><b>$${r.required_monthly_no_interest.toFixed(2)}</b><span>a month without interest</span></div></div>
  <svg viewBox="0 0 ${W} ${H}"><line x1="${P}" x2="${W-P}" y1="${y(s.goal)}" y2="${y(s.goal)}" stroke="#c0392b" stroke-dasharray="6 4"/>
  <text x="${W-P}" y="${y(s.goal)-6}" text-anchor="end" font-size="12" fill="#c0392b">goal $${s.goal}</text>
  <polyline fill="none" stroke="#6a3dd1" stroke-width="3" points="${pts}"/>
  <text x="${P}" y="${H-8}" font-size="12" fill="#6f5f96">now</text><text x="${W-P}" y="${H-8}" text-anchor="end" font-size="12" fill="#6f5f96">month ${c.length-1}</text></svg>`;
};
document.getElementById("go").click();
</script></body></html>
