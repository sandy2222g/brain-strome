<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PageRank Lab</title>
<style>
:root{--bg:#e9ecef;--ink:#1d2733;--brick:#b5412f;--slate:#4d6379;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Gill Sans","Calibri",sans-serif}
header{border-bottom:6px solid var(--brick);background:var(--card)}header div{max-width:880px;margin:0 auto;padding:22px 18px}
h1{margin:0;font:700 34px/1.1 "Palatino Linotype",Georgia,serif}.sub{margin:6px 0 0;color:var(--slate);max-width:640px}
main{max-width:880px;margin:0 auto;padding:22px 18px}.card{background:var(--card);padding:18px;border-radius:4px;box-shadow:0 1px 0 #0002}
.head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}input[type=range]{accent-color:var(--brick)}
.legend{font-size:13px;color:var(--slate)}.legend i{display:inline-block;width:12px;height:12px;margin:0 4px 0 12px;vertical-align:-1px}
.row{display:grid;grid-template-columns:110px 1fr 150px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bars{display:flex;flex-direction:column;gap:3px}.b1{height:12px;background:var(--brick)}.b2{height:6px;background:var(--slate)}
.num{font-variant-numeric:tabular-nums;color:var(--slate);font-size:13px}.note{font-size:14px;color:var(--slate);margin-top:14px}
</style></head><body><header><div><h1>PageRank lab</h1><p class="sub">Which pages of a small town's websites matter most? It is not about how many links a page gets, but who links to it.</p></div></header>
<main><div class="card"><div class="head"><label>damping <input id="d" type="range" min="0" max="0.99" step="0.01" value="0.85"> <b id="dv">0.85</b></label>
<span class="legend"><i style="background:#b5412f"></i>PageRank<i style="background:#4d6379"></i>links in</span></div><div id="rows"></div>
<p class="note" id="n"></p></div></main><script>
const $=i=>document.getElementById(i);
async function load(){const d=$('d').value;$('dv').textContent=d;const j=await (await fetch('/town?damping='+d)).json();
const deg=Object.fromEntries(j.indegree.map(x=>[x.page,x.links_in])),mx=Math.max(...j.pagerank.map(x=>x.score));
$('rows').innerHTML=j.pagerank.map(x=>`<div class="row"><span>${x.page}</span><div class="bars"><div class="b1" style="width:${x.score/mx*100}%"></div><div class="b2" style="width:${deg[x.page]/8*100}%"></div></div><span class="num">${(x.score*100).toFixed(1)}%  |  ${deg[x.page]} in</span></div>`).join('');
$('n').textContent='Look at the clinic: one link in, yet it outranks the sports club with three, because its single link comes from the town hall. At damping 0 every page scores the same; raising it lets the link structure matter more.'}
$('d').oninput=load;load();
</script></body></html>
