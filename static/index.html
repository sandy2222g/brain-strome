<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tile Box Calculator</title>
<style>
:root{--bg:#e8eef2;--ink:#14323f;--accent:#0b7285;--card:#fff;--mute:#5d7480;--bad:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:780px;margin:0 auto;padding:32px 16px}
h1{margin:0;font-size:2.1rem;color:var(--accent)}p{color:var(--mute)}
button{background:var(--ink);color:#fff;border:0;padding:.6rem 1.3rem;font:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);padding:16px;border-left:6px solid var(--accent)}.card.bad{border-left-color:var(--bad)}
.card h2{margin:0;font-size:.85rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:2rem;font-weight:700}.grid{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:8px}
.t{aspect-ratio:1;background:#b6d4dc}.t.x{background:var(--bad)}
</style></head><body><main>
<h1>Tile Box Calculator</h1>
<p id="sub">Boxes to buy, with an allowance for cuts.</p>
<button id="go">Calculate the sample room</button><div class="row" id="out"></div></main>
<script>
const out=document.getElementById("out");
document.getElementById("go").onclick=async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/calc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  document.getElementById("sub").textContent=`${s.width_m} x ${s.length_m} m room, ${s.tile_cm} cm tiles, ${s.tiles_per_box} per box at $${s.box_price}, ${r.layout} layout.`;
  const c=r.chosen,short=Math.max(0,-c.naive_spare_after_cuts);
  let g="";for(let i=0;i<Math.min(c.tiles_with_waste,96);i++)g+=`<div class="t ${i>=Math.min(c.tiles_with_waste,96)-Math.round(96*short/c.tiles_with_waste)?"x":""}"></div>`;
  out.innerHTML=`<div class="card"><h2>Buy</h2><div class="big">${c.boxes} boxes</div>$${c.cost.toFixed(2)}, ${c.spare_tiles} spare tiles</div>
  <div class="card"><h2>Straight layout</h2><div class="big">${r.straight.boxes} boxes</div>$${r.straight.cost.toFixed(2)}</div>
  <div class="card"><h2>Diagonal layout</h2><div class="big">${r.diagonal.boxes} boxes</div>$${r.diagonal.cost.toFixed(2)}</div>
  <div class="card bad"><h2>No allowance</h2><div class="big">${c.naive_boxes} boxes</div>${short} tiles short once cuts are counted
  <div class="grid">${g}</div></div>`;
};
document.getElementById("go").click();
</script></body></html>
