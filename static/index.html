<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Night</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101a;--card:#211a2b;--ink:#f5ecd9;--mute:#b3a7c0;--pink:#ff4f9a;--stub:#f5ecd9;--stubink:#241a20;--line:#3a2e49}
@media(prefers-color-scheme:light){:root{--bg:#f3ecdf;--card:#fff8ea;--ink:#241a20;--mute:#6f6272;--pink:#d6246f;--stub:#241a20;--stubink:#f5ecd9;--line:#dccfb8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",sans-serif}
main{max-width:1000px;margin:auto;padding:24px 16px 56px}h1{font:400 clamp(3rem,13vw,6rem)/.9 "Bebas Neue";margin:0;letter-spacing:.02em}h1 span{color:var(--pink)}.sub{color:var(--mute);margin:6px 0 20px}
h2{font:400 1.5rem "Bebas Neue";letter-spacing:.06em;margin:18px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;font-size:.85rem;transition:transform 150ms}.chips label:hover{transform:translateY(-2px)}
input[type=checkbox],input[type=radio]{accent-color:var(--pink);width:16px;height:16px}:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.strat{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}.strat label{display:flex;gap:6px;align-items:center;min-height:44px}
.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.t{background:var(--stub);color:var(--stubink);border-radius:10px;padding:14px 16px;position:relative;animation:in .3s both}.t:before,.t:after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--bg);border-radius:50%}.t:before{left:-9px}.t:after{right:-9px}
.t small{letter-spacing:.14em;text-transform:uppercase;opacity:.7}.t h3{font:400 1.7rem/1.1 "Bebas Neue";margin:2px 0 6px}.t .n{display:flex;gap:14px;font-size:.85rem}.t b{color:var(--pink)}
.m{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}.m b{display:block;font:400 1.8rem "Bebas Neue";color:var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<h1>Movie <span>Night</span></h1><p class="sub">Pick who is on the sofa. Get films none of you has seen that nobody should hate.</p>
<h2>Who is watching?</h2><div class="chips" id="u" role="group" aria-label="Viewers"></div>
<div class="strat" role="radiogroup" aria-label="Strategy"><label><input type="radio" name="s" value="least_misery" checked>Nobody hates it (least misery)</label><label><input type="radio" name="s" value="average">Best on average</label></div>
<h2>Tonight's tickets</h2><div class="tickets" id="o" aria-live="polite"></div><div class="m" id="m"></div></main>
<script>
const $=i=>document.getElementById(i);let users=[];
async function pick(){const members=[...document.querySelectorAll("#u input:checked")].map(e=>+e.value);if(!members.length){$("o").innerHTML="<p>Choose at least one viewer.</p>";return}
const s=document.querySelector("input[name=s]:checked").value;
const r=await fetch("/pick",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({members,strategy:s})});const d=await r.json();
$("o").innerHTML=d.picks.map((p,i)=>`<div class="t" style="animation-delay:${i*50}ms"><small>${p.genre} · admit ${members.length}</small><h3>${p.title}</h3><div class="n"><span>group <b>${p.score}</b></span><span>lowest <b>${p.min}</b></span><span>average <b>${p.mean}</b></span></div></div>`).join("")}
async function init(){const d=await (await fetch("/sample")).json();users=d.users;
$("u").innerHTML=users.slice(0,12).map((n,i)=>`<label><input type="checkbox" value="${i}" ${i<4?"checked":""}>${n}</label>`).join("");
document.querySelectorAll("input").forEach(e=>e.onchange=pick);pick();
const m=await (await fetch("/metrics")).json(),g=m.group_eval;
$("m").innerHTML=`<div><b>${m.rmse_model}</b>rating error (model)</div><div><b>${m.rmse_film_mean}</b>per-film average</div><div><b>${m.rmse_global_mean}</b>one global average</div><div><b>${g.least_misery_min}</b>worst viewer's true score, our pick</div><div><b>${g.random_min}</b>same, random film</div>`}
init();
</script></body></html>
