<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raffle Ticket Reality Check</title>
<style>
:root{--bg:#fff7e6;--ink:#2d1e12;--red:#c8372d;--teal:#117a8b;--mut:#8a7561;--card:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Gill Sans","Trebuchet MS",sans-serif;padding:34px 20px}
main{max-width:920px;margin:auto}.ticket{background:var(--red);color:#fff;padding:22px 30px;border-radius:12px;position:relative;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}.ticket:before{left:-13px}.ticket:after{right:-13px}
h1{font:900 32px Impact,"Arial Black",sans-serif;margin:0;letter-spacing:1px;text-transform:uppercase}.ticket p{margin:0;opacity:.9}.ticket b{font:900 15px "Courier New",monospace;border:2px dashed #fff;padding:6px 12px;border-radius:6px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;align-items:end}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}select,input{font:inherit;padding:8px 10px;border:2px solid #e6d5bb;border-radius:8px;background:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.g{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid #ecdcc2;border-radius:14px;padding:18px;margin-bottom:18px}h2{font:700 13px "Gill Sans",sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);margin:0 0 10px}
.big b{font:900 44px Impact,sans-serif;color:var(--red);line-height:1}.big span{display:block;color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;text-align:right;border-bottom:1px solid #f0e5d1}th{font-size:11px;text-transform:uppercase;color:var(--mut)}td:first-child,th:first-child{text-align:left}
svg{width:100%;height:170px}.m{font-size:13px;color:var(--mut)}
</style></head><body><main>
<div class="ticket"><div><h1>Ticket reality check</h1><p>What does a decade of weekly tickets actually do to your wallet?</p></div><b id="cost"></b></div>
<div class="row"><div><label>Game</label><select id="g"></select></div><div><label>Tickets bought</label><input id="t" type="number" min="1" max="2000" value="520" style="width:110px"></div></div>
<div class="g"><div class="card big" id="k1"></div><div class="card big" id="k2"></div></div>
<div class="g"><div class="card"><h2>Chance of each prize</h2><table id="tb"></table></div><div class="card"><h2>1,000 imaginary players: final winnings</h2><svg id="sv" viewBox="0 0 400 170" preserveAspectRatio="none"></svg><div class="m" id="sm"></div></div></div>
<div class="card"><h2>Raffle: is my ticket worth it?</h2><div class="row"><div><label>Tickets sold</label><input id="rs" type="number" value="500" style="width:100px"></div><div><label>Mine</label><input id="rm" type="number" value="10" style="width:80px"></div><div><label>Prize $</label><input id="rp" type="number" value="200" style="width:90px"></div><div><label>Price each $</label><input id="rc" type="number" value="2" style="width:90px"></div></div><div id="ro" class="m"></div></div>
</main><script>
const $=i=>document.getElementById(i);const f=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();let tm;
async function go(){const r=await fetch(`/analyse?game=${$('g').value}&tickets=${$('t').value}`);const j=await r.json();if(!r.ok)return;
const s=j.sim,e=j.ev;$('cost').textContent='SPENT '+f(s.spent);
$('k1').innerHTML=`<b>${(s.share_ahead*100).toFixed(1)}%</b><span>of players ended up ahead</span>`;
$('k2').innerHTML=`<b>${Math.round(e.payout_rate*100)}¢</b><span>paid back per $1 spent; typical player lost ${f(-s.median_net)}</span>`;
$('tb').innerHTML='<tr><th>Matches</th><th>Prize</th><th>Odds</th></tr>'+j.tiers.filter(t=>t.prize>0).map(t=>`<tr><td>${t.matches}</td><td>${f(t.prize)}</td><td>1 in ${Math.round(t.one_in).toLocaleString()}</td></tr>`).join('');
const mx=Math.max(...s.hist.map(h=>h.count)),w=400/s.hist.length;
$('sv').innerHTML=s.hist.map((h,i)=>`<rect x="${i*w+1}" y="${160-h.count/mx*150}" width="${w-2}" height="${h.count/mx*150}" fill="${h.to<=0?'#c8372d':'#117a8b'}"><title>${f(h.from)} to ${f(h.to)}: ${h.count} players</title></rect>`).join('')+`<text x="2" y="168" font-size="10" fill="#8a7561">${f(s.worst)}</text><text x="398" y="168" font-size="10" fill="#8a7561" text-anchor="end">${f(s.best)}</text>`;
$('sm').textContent=`Red = lost money. Best player: ${f(s.best)}. Jackpots hit across all players: ${s.jackpots}.`}
async function raf(){const q=new URLSearchParams({tickets_sold:$('rs').value,mine:$('rm').value,prize:$('rp').value,price:$('rc').value});const r=await fetch('/raffle?'+q);const j=await r.json();
$('ro').innerHTML=r.ok?`You win <b>${(j.p_win*100).toFixed(1)}%</b> of the time. Expected prize ${f(j.expected_prize)} for a cost of ${f(j.cost)}: net <b>${f(j.net)}</b> on average. Break-even prize: ${f(j.break_even_prize)}.`:j.detail}
fetch('/games').then(r=>r.json()).then(d=>{$('g').innerHTML=d.games.map((n,i)=>`<option value="${i}">${n}</option>`).join('');go()});
['g','t'].forEach(i=>$(i).oninput=()=>{clearTimeout(tm);tm=setTimeout(go,250)});['rs','rm','rp','rc'].forEach(i=>$(i).oninput=raf);raf();
</script></body></html>
