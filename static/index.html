<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Strength Coach</title>
<style>
:root{--bg:#eef2f0;--ink:#1c2b27;--card:#fff;--r:#d64545;--o:#e89a2c;--y:#d9c53b;--g:#3a9a5b;--gg:#1f7a4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:36px 18px}h1{font-size:28px;margin:0 0 4px}.sub{margin:0 0 22px;opacity:.7}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 6px 24px #1c2b2714}
input{width:100%;font:20px ui-monospace,monospace;padding:12px 14px;border:2px solid #cdd8d3;border-radius:10px}input:focus{outline:none;border-color:var(--gg)}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 8px}.meter i{height:10px;border-radius:5px;background:#e3eae6}
.big{font-size:22px;font-weight:700}.small{opacity:.7;font-size:14px}ul{padding-left:20px;margin:12px 0 0}li{margin:4px 0}
.try{margin-top:18px;font-size:14px}.try button{font:inherit;border:1px solid #cdd8d3;background:#f6f9f7;border-radius:14px;padding:2px 10px;margin:2px;cursor:pointer}
.pp{margin-top:20px;background:#e7f3ec;border-radius:12px;padding:12px 14px;font-size:14px}
</style></head><body><main>
<h1>Password strength coach</h1><p class="sub">Type to see how long a fast attacker would need. Nothing is stored; this demo only analyses it in memory.</p>
<div class="card"><input id="p" placeholder="try a password" autocomplete="off" spellcheck="false">
<div class="meter" id="m"><i></i><i></i><i></i><i></i><i></i></div><div class="big" id="verdict"></div><div class="small" id="det"></div><ul id="w"></ul>
<div class="try">Try: <span id="ex"></span></div>
<div class="pp" id="pp"></div></div>
</main><script>
const $=i=>document.getElementById(i);const cols=['#d64545','#e89a2c','#d9c53b','#3a9a5b','#1f7a4d'],names=['Very weak','Weak','Okay','Strong','Very strong'];
let tmr;async function check(){const v=$('p').value;if(!v){$('verdict').textContent='';$('det').textContent='';$('w').innerHTML='';[...$('m').children].forEach(i=>i.style.background='#e3eae6');return}
const r=await fetch('/assess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:v})});if(!r.ok)return;const j=await r.json();
[...$('m').children].forEach((el,i)=>el.style.background=i<=j.score?cols[j.score]:'#e3eae6');
$('verdict').textContent=names[j.score];$('det').textContent=`About ${j.entropy_bits} bits of entropy. A fast attacker: ${j.crack_time}.`;
$('w').innerHTML=j.warnings.map(x=>`<li>${x}</li>`).join('')}
$('p').oninput=()=>{clearTimeout(tmr);tmr=setTimeout(check,120)};
$('ex').innerHTML=['letmein','Tr0ub4dor&3','correct horse battery staple','qzvmtbhs'].map(x=>`<button>${x}</button>`).join('');
$('ex').onclick=e=>{if(e.target.tagName==='BUTTON'){$('p').value=e.target.textContent;check()}};
fetch('/passphrase?words=5').then(r=>r.json()).then(j=>{$('pp').textContent=`Tip: five random dictionary words give about ${j.entropy_bits} bits and are far easier to remember than symbols.`});
$('p').value='correct horse battery staple';check();
</script></body></html>
