<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinner On Time</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6e4d2;--card:#fff6ec;--ink:#3a2418;--mute:#7c6252;--brick:#b5452b;--line:#e1c6ac;--chicken:#c9693a;--potato:#d9a53a;--beans:#5c8a4d;--gravy:#8a5a3c;--crumble:#b0527a}
@media(prefers-color-scheme:dark){:root{--bg:#1f1612;--card:#2a1e18;--ink:#f6e9dc;--mute:#bfa592;--brick:#ff7d5c;--line:#483528;--chicken:#e08a58;--potato:#e8bb52;--beans:#7fb36d;--gravy:#b88360;--crumble:#d878a4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Mulish,sans-serif}
main{max-width:1040px;margin:auto;padding:24px 16px 56px}h1{font:400 clamp(2.2rem,8vw,3.8rem)/1 "Alfa Slab One";margin:0;color:var(--brick)}.sub{color:var(--mute);margin:8px 0 18px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.s{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 16px}.s b{display:block;font:400 1.8rem "Alfa Slab One";color:var(--brick)}.s span{font-size:.8rem;color:var(--mute)}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:14px;overflow-x:auto}.panel h2{margin:0 0 8px;font:400 1.1rem "Alfa Slab One"}
svg{width:100%;min-width:680px;height:auto;display:block}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;margin-top:6px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
</style></head><body><main>
<h1>Dinner On Time</h1><p class="sub">Five dishes, one oven, one pair of hands. Every step is scheduled backwards from serving so it all lands together.</p>
<div class="stats" id="st" aria-live="polite"></div>
<div class="panel"><h2>Plan: times are minutes before serving</h2><svg id="a" viewBox="0 0 720 230" role="img" aria-label="Synced timeline by resource"></svg><div class="legend" id="lg"></div></div>
<div class="panel"><h2>Instead: start everything now, in the order written</h2><svg id="b" viewBox="0 0 720 230" role="img" aria-label="Sequential timeline by resource"></svg></div></main>
<script>
const $=i=>document.getElementById(i),COL={"Roast chicken":"var(--chicken)","Roast potatoes":"var(--potato)","Green beans":"var(--beans)","Gravy":"var(--gravy)","Apple crumble":"var(--crumble)"};
const LANES=["oven","hob","hands"];
function draw(el,slots,max){const X=m=>40+(max-m)/max*660,Y=l=>30+LANES.indexOf(l)*62;let g="";
LANES.forEach(l=>g+=`<text x="2" y="${Y(l)+22}" font-size="11" fill="currentColor" opacity=".7">${l}</text><line x1="40" x2="700" y1="${Y(l)+30}" y2="${Y(l)+30}" stroke="currentColor" opacity=".15"/>`);
for(let m=0;m<=max;m+=30)g+=`<text x="${X(m)}" y="222" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">${m?"-"+m:"serve"}</text>`;
const lanes={};slots.forEach(s=>{const k=s.resource;lanes[k]=lanes[k]||[];let row=0;while(lanes[k].some(o=>o.row===row&&o.s.end<s.start&&s.end<o.s.start))row++;lanes[k].push({s,row});
const w=X(s.end)-X(s.start),y=Y(k)+row*18;g+=`<rect x="${X(s.start)}" y="${y}" width="${Math.max(w-1,2)}" height="16" rx="3" fill="${COL[s.dish]||"#888"}"><title>${s.dish}: ${s.step} (${s.start-s.end} min)</title></rect>`;if(w>46)g+=`<text x="${X(s.start)+4}" y="${y+12}" font-size="9" fill="#fff" font-weight="700">${s.dish.split(" ")[1]||s.dish}</text>`});
$(el).innerHTML=g}
(async()=>{const s=await (await fetch("/sample")).json();const r=await (await fetch("/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({capacity:s.capacity,dishes:s.dishes})})).json();
const mx=Math.max(r.synced.span,r.sequential.span);
$("st").innerHTML=`<div class="s"><b>${r.synced.span} min</b><span>start to serve, synced</span></div><div class="s"><b>${r.sequential.span} min</b><span>start to serve, in order written</span></div><div class="s"><b>${r.synced.waiting}</b><span>minutes food waits, synced</span></div><div class="s"><b>${r.sequential.waiting}</b><span>minutes food waits, in order written</span></div>`;
draw("a",r.synced.slots,mx);draw("b",r.sequential.slots,mx);
$("lg").innerHTML=Object.entries(COL).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join("")})();
</script></body></html>
