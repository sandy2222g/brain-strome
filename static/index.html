<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist Fitter</title>
<style>
:root{--bg:#0d0d0d;--ink:#eaeaea;--accent:#ff7a1a;--card:#1a1a1a;--mute:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
main{max-width:820px;margin:0 auto;padding:32px 16px}
h1{margin:0;font-size:2rem;color:var(--accent);text-transform:lowercase}p{color:var(--mute)}
button{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:.5rem 1.2rem;font:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:20px}
.box{background:var(--card);padding:16px;border-top:3px solid var(--mute)}.box.win{border-top-color:var(--accent)}
.box h2{margin:0;font-size:.9rem;color:var(--mute)}.time{font-size:2rem;color:var(--ink)}
.bar{display:flex;height:16px;margin:10px 0;background:#2a2a2a}.seg{border-right:1px solid #0d0d0d;background:var(--accent)}.dim .seg{background:#777}
ol{margin:0;padding-left:1.4rem;font-size:.85rem;color:var(--mute)}
</style></head><body><main>
<h1>playlist fitter</h1>
<p id="sub">Fill the drive exactly, no cut-off last song.</p>
<button id="go">fit the sample trip</button><div class="row" id="out"></div></main>
<script>
const out=document.getElementById("out"),fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
document.getElementById("go").onclick=async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/fit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  document.getElementById("sub").textContent=`Trip length ${fmt(r.target)}.`;
  out.innerHTML="";
  for(const [k,t] of [["best","best fit"],["in_order","list order"]]){
    const p=r[k],d=document.createElement("div");d.className="box"+(k==="best"?" win":" dim");
    let h=`<h2>${t} &middot; ${p.songs.length} songs</h2><div class="time">${fmt(p.seconds)}</div><div class="bar">`;
    for(const x of p.songs)h+=`<div class="seg" style="width:${x.seconds/r.target*100}%"></div>`;
    h+=`</div><ol>`;for(const x of p.songs)h+=`<li>${x.title} (${fmt(x.seconds)})</li>`;
    d.innerHTML=h+"</ol>";out.appendChild(d);
  }
};
document.getElementById("go").click();
</script></body></html>
