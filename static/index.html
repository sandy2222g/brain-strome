<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warm Hours</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;900&family=Red+Hat+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e8;--card:#fffdf9;--ink:#2a1b14;--mute:#7a6558;--hot:#e8542a;--cool:#2f6fdb;--cheap:#cfe7d6;--mid:#f6e4b8;--dear:#f4c4b8;--line:#ecd9c6}
@media(prefers-color-scheme:dark){:root{--bg:#1a1210;--card:#251a16;--ink:#f8e9df;--mute:#bba294;--hot:#ff7a50;--cool:#7aa7ff;--cheap:#1f3d2c;--mid:#4a3d1c;--dear:#5a2b22;--line:#443228}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Red Hat Text",sans-serif}
main{max-width:1000px;margin:auto;padding:24px 16px 56px}h1{font:900 clamp(2.2rem,8vw,3.8rem)/1 "Red Hat Display";margin:0}h1 em{font-style:normal;color:var(--hot)}.sub{color:var(--mute);margin:6px 0 20px}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px}.s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px}.s b{display:block;font:900 1.9rem "Red Hat Display"}.s b.g{color:#2f9e5a}.s span{color:var(--mute);font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;overflow-x:auto}.panel h2{margin:0 0 6px;font:900 1rem "Red Hat Display"}
svg{width:100%;min-width:640px;height:auto;display:block}.leg{font-size:.8rem;color:var(--mute)}.leg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin:0 4px 0 12px}
</style></head><body><main>
<h1>Warm <em>Hours</em></h1><p class="sub">A two-day winter forecast. Heat when power is cheap, coast when it is dear, be warm when you are home.</p>
<div class="stats" id="st" aria-live="polite"></div>
<div class="panel"><h2>Indoor temperature</h2><svg id="c" viewBox="0 0 720 260" role="img" aria-label="Indoor temperature, optimised and thermostat"></svg>
<div class="leg"><i style="background:var(--hot)"></i>optimised<i style="background:var(--cool)"></i>plain thermostat<i style="background:#999;height:10px"></i>comfort target while home</div></div>
<div class="panel"><h2>Heater on (optimised) over the price of power</h2><svg id="h" viewBox="0 0 720 70" role="img" aria-label="Heater schedule"></svg></div></main>
<script>
const $=i=>document.getElementById(i),X=h=>30+h/48*670,Y=t=>230-(t-12)*14.5;
async function go(){const day=await (await fetch("/day")).json();const r=await (await fetch("/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({})})).json();
const o=r.optimised,t=r.thermostat;
$("st").innerHTML=`<div class="s"><b class="g">$${o.energy_cost.toFixed(2)}</b><span>optimised energy cost (${o.kwh} kWh)</span></div><div class="s"><b>$${t.energy_cost.toFixed(2)}</b><span>thermostat (${t.kwh} kWh)</span></div><div class="s"><b>${o.cold_degree_hours}</b><span>cold degree-hours (thermostat ${t.cold_degree_hours})</span></div><div class="s"><b>${o.overheat_degree_hours}</b><span>overheat degree-hours (thermostat ${t.overheat_degree_hours})</span></div>`;
let g="";for(let d=0;d<2;d++)for(const [a,b,tg] of day.comfort)g+=`<rect x="${X(a+24*d)}" y="${Y(tg)}" width="${X(b)-X(a)}" height="3" fill="#999" opacity=".7"/>`;
for(let t=12;t<=26;t+=2)g+=`<text x="4" y="${Y(t)+4}" font-size="10" fill="currentColor" opacity=".6">${t}</text><line x1="26" x2="700" y1="${Y(t)}" y2="${Y(t)}" stroke="currentColor" opacity=".08"/>`;
for(let h=0;h<=48;h+=6)g+=`<text x="${X(h)}" y="252" font-size="10" fill="currentColor" opacity=".6" text-anchor="middle">${h%24}h</text>`;
const line=(a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${a.map((v,i)=>X(i+1)+","+Y(v)).join(" ")}"/>`;
$("c").innerHTML=g+line(t.temps,"var(--cool)")+line(o.temps,"var(--hot)");
const col=p=>p<=.15?"var(--cheap)":p<=.25?"var(--mid)":"var(--dear)";
$("h").innerHTML=day.price.map((p,i)=>`<rect x="${X(i)}" y="30" width="${670/48-1}" height="32" fill="${col(p)}"/>`+(o.schedule[i]?`<rect x="${X(i)}" y="30" width="${670/48-1}" height="32" fill="var(--hot)" opacity=".85"/>`:"")).join("")+`<text x="30" y="20" font-size="11" fill="currentColor" opacity=".7">green = cheap power, yellow = normal, red = dear; solid orange = heater on</text>`}
go();
</script></body></html>
