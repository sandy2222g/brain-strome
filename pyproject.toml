[project]
name = "pantry-saver"
version = "1.0.0"
description = "Rank pantry items by expiry urgency, recommend recipes that use them, and plan a low-waste week"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "numpy>=1.26",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint.isort]
known-first-party = ["pantry"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
